name: Supabase Keep Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic en GitHub Actions

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping y Consulta SQL Real a Supabase
        run: |
          echo "Realizando consulta SELECT a Supabase para mantener la BD activa..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Código HTTP recibido: $STATUS"
          echo "Respuesta: $BODY"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Base de datos consultada exitosamente. Actividad registrada en Supabase."
          else
            echo "❌ Error al consultar la base de datos."
            exit 1
          fi
